<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Calculadora Penal">
  <!-- Google Sign In -->
  <meta name="google-signin-client_id" content="148303670455-558pbf6atg8lr4c2332m016e0m3dua1e.apps.googleusercontent.com">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="penas_calc">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Penal Calculator</title>
  <link rel="manifest" href="manifest.json">

  <!-- SDK Web da RevenueCat, usado no checkout de assinatura (web/checkout_service.dart) -->
  <script src="https://unpkg.com/@revenuecat/purchases-js@1/dist/Purchases.umd.js"></script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>

  <!--
    Camada de checkout web (RevenueCat presentPaywall). Fica escondida por
    padrão; o Dart (lib/services/web_checkout/checkout_service_web.dart)
    mostra/esconde e injeta o formulário de pagamento aqui dentro.
    Fica fora da árvore de widgets do Flutter de propósito, pra não depender
    de APIs de platform view que mudam entre versões do Flutter Web.
  -->
  <div id="rc-checkout-overlay" style="
      display: none;
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: rgba(0,0,0,0.6);
      align-items: center;
      justify-content: center;
    ">
    <div style="
        position: relative;
        width: min(480px, 92vw);
        max-height: 90vh;
        overflow: auto;
        background: #fff;
        border-radius: 16px;
        padding: 8px;
      ">
      <button id="rc-checkout-close" style="
          position: absolute;
          top: 8px;
          right: 8px;
          z-index: 1;
          border: none;
          background: transparent;
          font-size: 20px;
          cursor: pointer;
        ">✕</button>
      <div id="rc-checkout-target" style="min-height: 640px; min-width: 320px;"></div>
    </div>
  </div>
</body>
</html>
