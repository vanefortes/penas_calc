name: penas_calc
description: Calculadora de Penas para Advogado Criminalista
publish_to: 'none'
version: 1.0.0+7

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  crypto: ^3.0.6
  intl: ^0.20.2
  shared_preferences: ^2.2.2
  share_plus: ^7.2.1
  flutter_localizations:
    sdk: flutter
  google_fonts: ^6.1.0
  provider: ^6.1.1
  image_picker: ^1.1.2
  local_auth: ^2.3.0
  google_sign_in: ^7.2.0
  google_sign_in_web: ^1.1.0
  sign_in_with_apple: ^6.1.4
  purchases_flutter: ^8.2.0
  url_launcher: ^6.3.1
  http: ^1.2.0
  pdf: ^3.11.1
  printing: ^5.13.1
  package_info_plus: ^8.0.0
  in_app_update: ^4.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  # ───── NOVO: declarar a logo da splash ─────
  assets:
    - assets/logo.png
    - assets/icon/

flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
    image_path: "assets/logo.png"
  image_path: "assets/icon/logo.png"
